<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.dashboard{
    width:450px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#4f46e5;
    color:#fff;
    font-size:40px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0 auto 20px;
}

h1{
    color:#333;
}

h1 span{
    color:#4f46e5;
}

p{
    color:#666;
    margin:15px 0 25px;
}

button{
    background:#4f46e5;
    color:#fff;
    border:none;
    padding:12px 30px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#372dbb;
}
</style>

</head>
<body>

<div class="dashboard">

<div class="avatar">M</div>

<h1>Welcome, <span>Mehmona Jabeen</span> 👋</h1>

<p>You have successfully logged in to your Brand New account.</p>


<a href="index.html">
    <button>Go to home</button>

</div>

</body>
</html>

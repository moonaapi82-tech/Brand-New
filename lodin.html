<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand New - Sign In</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f3f3f3;
}

.logo{
    text-align:center;
    margin:30px 0;
}

.logo h1{
    color:#ff9900;
    font-size:40px;
}

.login-box{
    width:350px;
    margin:auto;
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;
    padding:25px;
}

.login-box h2{
    margin-bottom:20px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #999;
    border-radius:4px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    background:#ff9900;
    border:none;
    border-radius:20px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#e68a00;
}

.small{
    font-size:13px;
    margin-top:20px;
    line-height:22px;
}

.small a{
    color:#0066c0;
    text-decoration:none;
}

.business{
    margin-top:20px;
    border-top:1px solid #ddd;
    padding-top:15px;
}

.footer{
    margin-top:40px;
    text-align:center;
    font-size:13px;
    color:#555;
}

.footer a{
    text-decoration:none;
    color:#0066c0;
    margin:0 10px;
}
</style>

</head>
<body>

<div class="logo">
    <h1>Brand New</h1>
</div>

<div class="login-box">

<h2>Sign In or Create Account</h2>

<label>Email or Mobile Number</label>

<input type="text" placeholder="Enter email or mobile number">

<button>Continue</button>

<p class="small">
By continuing, you agree to our
<a href="#">Terms & Conditions</a>
and
<a href="#">Privacy Policy</a>.
</p>

<div class="business">
<h3>Business Account</h3>
<p>Create a free business account.</p>
</div>

</div>

<div class="footer">

<p>
<a href="#">Terms & Conditions</a> |
<a href="#">Privacy Policy</a> |
<a href="#">Help</a>
</p>

<br>

<p>© 2026 Brand New Store. All Rights Reserved.</p>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand New - Sign In</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #ffffff;
}

.logo {
    text-align: center;
    margin: 25px 0;
}

.logo h1 {
    color: #ff9900;
    font-size: 40px;
    font-weight: bold;
}

.login-box {
    width: 360px;
    max-width: calc(100% - 30px);
    margin: auto;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 25px;
}

.login-box h2 {
    font-size: 26px;
    margin-bottom: 22px;
    font-weight: 400;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 11px;
    border: 1px solid #888;
    border-radius: 4px;
    margin-bottom: 18px;
    font-size: 15px;
}

input:focus {
    outline: none;
    border: 1px solid #ff9900;
    box-shadow: 0 0 4px rgba(255,153,0,.4);
}

.continue-btn {
    display: block;
    width: 100%;
    padding: 12px;
    background: #ffd814;
    border: 1px solid #fcd200;
    border-radius: 20px;
    cursor: pointer;
    font-size: 15px;
    text-align: center;
    text-decoration: none;
    color: #111;
}

.continue-btn:hover {
    background: #f7ca00;
}

.info {
    font-size: 13px;
    margin-top: 18px;
    line-height: 22px;
}

.info a {
    text-decoration: none;
    color: #0066c0;
}

.info a:hover {
    text-decoration: underline;
}

.help {
    display: block;
    margin-top: 18px;
    color: #0066c0;
    text-decoration: none;
    font-size: 14px;
}

.help:hover {
    text-decoration: underline;
}

.business {
    margin-top: 25px;
    border-top: 1px solid #ddd;
    padding-top: 20px;
}

.business h3 {
    font-size: 16px;
    margin-bottom: 8px;
}

.business a {
    color: #0066c0;
    text-decoration: none;
    font-size: 14px;
}

.business a:hover {
    text-decoration: underline;
}

footer {
    margin-top: 50px;
    border-top: 1px solid #ddd;
    padding: 30px 15px;
    text-align: center;
}

footer a {
    color: #0066c0;
    text-decoration: none;
    margin: 0 10px;
    font-size: 13px;
}

footer a:hover {
    text-decoration: underline;
}

footer p {
    margin-top: 15px;
    font-size: 12px;
    color: #555;
}

@media(max-width: 400px) {
    .login-box {
        padding: 20px;
    }

    .logo h1 {
        font-size: 34px;
    }
}
</style>
</head>

<body>

<div class="logo">
    <h1>Brand New</h1>
</div>

<div class="login-box">

    <h2>Sign in or Create Account</h2>

    <label for="email">Email or Mobile Number</label>

    <input
        type="text"
        id="email"
        placeholder="Enter your email or mobile number"
        required
    >

    <a href="dashbord.html" class="continue-btn">Continue</a>

    <p class="info">
        By continuing, you agree to our
        <a href="terms and condition.html">Terms & Conditions</a>
        and
        <a href="privcy Ploice.html">Privacy Policy</a>.
    </p>

    <a href="Help.html" class="help">Need help?</a>

    <div class="business">
        <h3>Buying for work?</h3>
        <a href="first workfree account.html">
            Create a free business account
        </a>
    </div>

</div>

<footer>

    <a href="terms and condition.html">Terms & Conditions</a>

    <a href="privcy Ploice.html">Privacy Policy</a>

    <a href="Help.html">Help</a>

    <p>© 2026 Brand New Store. All Rights Reserved.</p>

</footer>

</body>
</html>
